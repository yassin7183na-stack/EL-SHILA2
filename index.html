<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة المخادع - The Imposter</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #f43f5e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            color: #818cf8;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .hidden {
            display: none !important;
        }

        .secret-box {
            background-color: #0f172a;
            border: 2px dashed #475569;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .role-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .role-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 10px;
        }

        .imposter-text {
            color: var(--accent-color) !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="setup-screen">
            <h1>لعبة المخادع 🕵️‍♂️</h1>
            
            <div class="form-group">
                <label for="num-players">عدد اللاعبين:</label>
                <select id="num-players">
                    <option value="3">3 لاعبين</option>
                    <option value="4" selected>4 لاعبين</option>
                    <option value="5">5 لاعبين</option>
                    <option value="6">6 لاعبين</option>
                    <option value="7">7 لاعبين</option>
                    <option value="8">8 لاعبين</option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">اختر الفئة:</label>
                <select id="category">
                    <option value="footballers">لاعبو كرة قدم ⚽</option>
                    <option value="food">أطعمة ومأكولات 🍕</option>
                    <option value="actors">ممثلون ومشاهير 🎬</option>
                    <option value="countries">دول وعواصم 🌍</option>
                </select>
            </div>

            <button onclick="startGame()">بدء اللعبة</button>
        </div>

        <div id="game-screen" class="hidden">
            <h2 id="current-player-title">دور اللاعب 1</h2>
            <p>أعط الهاتف للاعب المذكور واضغط إظهار السر أدناه.</p>
            
            <div id="secret-container" class="secret-box hidden">
                <div class="role-title">الكلمة السرية أو هويتك:</div>
                <div id="secret-display" class="role-value"></div>
            </div>

            <button id="toggle-btn" onclick="toggleSecret()">إظهار السر</button>
            <button id="next-btn" class="hidden" onclick="nextPlayer()">التالي</button>
        </div>

        <div id="end-screen" class="hidden">
            <h1>جاهزون للنقاش! 🎯</h1>
            <p style="font-size: 1.1rem; line-height: 1.6;">تم توزيع الأدوار بنجاح.<br>ابدأوا في طرح الأسئلة على بعضكم البعض لاكتشاف من هو <b>المخادع</b> الذي لا يعرف السر!</p>
            <button onclick="resetGame()">لعبة جديدة</button>
        </div>
    </div>

    <script>
        // قواعد البيانات الخاصة بالفئات
        const dataCategories = {
            footballers: ["محمد صلاح", "ليونيل ميسي", "كريستيانو رونالدو", "كيليان مبابي", "كيفين دي بروين", "إيرلينغ هالاند", "نيمار جونيور", "لوكا مودريتش"],
            food: ["بيتزا", "برجر", "كبسة", "كشري", "سوشي", "مكرونة بشاميل", "شاورما", "فلافل"],
            actors: ["عادل إمام", "أحمد حلمي", "كريستيان بيل", "ليوناردو دي كابريو", "ويل سميث", "روبرت داوني جونيور", "منى زكي", "أحمد السقا"],
            countries: ["مصر", "السعودية", "فرنسا", "البرازيل", "إسبانيا", "إيطاليا", "اليابان", "المغرب"]
        };

        let totalPlayers = 4;
        let currentPlayer = 1;
        let imposterIndex = 1;
        let secretWord = "";
        let isSecretShown = false;

        function startGame() {
            totalPlayers = parseInt(document.getElementById("num-players").value);
            const selectedCategory = document.getElementById("category").value;
            
            // اختيار كلمة عشوائية من الفئة المختارة
            const wordsList = dataCategories[selectedCategory];
            secretWord = wordsList[Math.floor(Math.random() * wordsList.length)];
            
            // اختيار مخادع عشوائي بين اللاعبين
            imposterIndex = Math.floor(Math.random() * totalPlayers) + 1;

            currentPlayer = 1;
            isSecretShown = false;

            // الانتقال لشاشة اللعبة
            document.getElementById("setup-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            
            updateGameScreen();
        }

        function updateGameScreen() {
            document.getElementById("current-player-title").innerText = `دور اللاعب رقم ${currentPlayer}`;
            document.getElementById("secret-container").classList.add("hidden");
            document.getElementById("toggle-btn").classList.remove("hidden");
            document.getElementById("next-btn").classList.add("hidden");
            isSecretShown = false;
            document.getElementById("toggle-btn").innerText = "إظهار السر";
        }

        function toggleSecret() {
            const secretContainer = document.getElementById("secret-container");
            const secretDisplay = document.getElementById("secret-display");
            const toggleBtn = document.getElementById("toggle-btn");
            const nextBtn = document.getElementById("next-btn");

            if (!isSecretShown) {
                // إظهار السر
                secretContainer.classList.remove("hidden");
                if (currentPlayer === imposterIndex) {
                    secretDisplay.innerText = "انت المخادع! 🤫\nليس لديك كلمة سر، حاول ألا تكشف نفسك.";
                    secretDisplay.className = "role-value imposter-text";
                } else {
                    secretDisplay.innerText = secretWord;
                    secretDisplay.className = "role-value";
                }
                toggleBtn.innerText = "إخفاء السر";
                nextBtn.classList.remove("hidden");
                isSecretShown = true;
            } else {
                // إخفاء السر مجدداً قبل تمرير الهاتف
                secretContainer.classList.add("hidden");
                toggleBtn.innerText = "إظهار السر";
            }
        }

        function nextPlayer() {
            currentPlayer++;
            if (currentPlayer > totalPlayers) {
                // انتهى الجميع من معرفة أدوارهم
                document.getElementById("game-screen").classList.add("hidden");
                document.getElementById("end-screen").classList.remove("hidden");
            } else {
                updateGameScreen();
            }
        }

        function resetGame() {
            document.getElementById("end-screen").classList.add("hidden");
            document.getElementById("setup-screen").classList.remove("hidden");
        }
    </script>
</body>
</html>
