<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ألعاب الشلة المتكاملة</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #ec4899;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-top: 20px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        .game-screen {
            display: none;
            margin-top: 20px;
        }
        .back-btn {
            background-color: #ef4444;
            margin-bottom: 15px;
        }
        .back-btn:hover {
            background-color: #dc2626;
        }
        .box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }
        input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            width: 80%;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>🎮 حزمة ألعاب الشلة المتكاملة</h1>
    <p>كل الألعاب الأصلية والإضافات الجديدة في مكان واحد!</p>

    <div class="container">
        <!-- القائمة الرئيسية -->
        <div id="main-menu">
            <h3>اختر اللعبة اللي حابب تلعبها مع الشلة:</h3>
            <div class="menu-grid">
                <button onclick="openGame('impostor')">🕵️‍♂️ مين الإمبوستر؟</button>
                <button onclick="openGame('auction')">⚽ مزاد أساطير الكرة</button>
                <button onclick="openGame('buhour')">🌊 بحور ولا مبحورش؟</button>
                <button onclick="openGame('whoIs')">👥 مين الصاحب؟</button>
                <button onclick="openGame('truthDare')">🔥 أسئلة وعقاب الشلة</button>
                <button onclick="openGame('emoji')">🧩 تخمين الإيموجي</button>
                <button onclick="openGame('bomb')">💣 القنبلة الموقوتة</button>
            </div>
        </div>

        <!-- شاشات الألعاب الفرعية -->
        <div id="game-container" class="game-screen">
            <button class="back-btn" onclick="goHome()">🔙 رجوع للقائمة</button>
            <div id="game-content"></div>
        </div>
    </div>

    <script>
        function openGame(gameName) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            let content = '';

            switch(gameName) {
                case 'impostor':
                    content = `<h2>🕵️‍♂️ مين الإمبوستر؟</h2>
                               <p>اكتشف المتسلل وسط طاقم العمل!</p>
                               <div class="box"><button onclick="alert('تم توزيع الأدوار! راقب تصرفات أصدقائك.')">بدء الجولة وتوزيع الأدوار</button></div>`;
                    break;
                case 'auction':
                    content = `<h2>⚽ مزاد أساطير الكرة</h2>
                               <p>تنافس لشراء أفضل نجوم وأساطير المستطيل الأخضر بميزانيتك.</p>
                               <div class="box"><button onclick="alert('اللاعب المعروض حالياً: رونالدو - ابدأ المزايدة!')">بدء المزاد العشوائي</button></div>`;
                    break;
                case 'buhour':
                    content = `<h2>🌊 بحور ولا مبحورش؟</h2>
                               <p>اختبر سرعة بديهتك في ذكر الأمثلة والتصنيفات دون تردد.</p>
                               <div class="box"><button onclick="alert('التصنيف الحالي: بلاد بحرف الـ م! اسرع!')">سحب تصنيف جديد</button></div>`;
                    break;
                case 'whoIs':
                    content = `<h2>👥 مين الصاحب؟</h2>
                               <p>اعرف رأي الشلة في بعضهم في مواقف كوميدية ومحرجة.</p>
                               <div class="box"><button onclick="alert('مين أكتر واحد بينسى يشحن موبايله؟')">سؤال جديد للشلة</button></div>`;
                    break;
                case 'truthDare':
                    content = `<h2>🔥 أسئلة وعقاب الشلة</h2>
                               <p>صراحة مطلقة أو عقاب كوميدي ناري!</p>
                               <div class="box"><button onclick="alert('السؤال: ايه أغبى موقف عملته وأنت صغير؟ (أو نفذ العقاب)')">اسحب بطاقة صراحة/عقاب</button></div>`;
                    break;
                case 'emoji':
                    content = `<h2>🧩 تخمين الإيموجي</h2>
                               <p>فك رموز الألغاز والأفلام من خلال الإيموجيز.</p>
                               <div class="box"><h3>🎬 🦁 👑</h3><button onclick="alert('الإجابة الصحيحة: فيلم الأسد الملك (The Lion King)!')">إظهار الإجابة</button></div>`;
                    break;
                case 'bomb':
                    content = `<h2>💣 القنبلة الموقوتة</h2>
                               <p>أجب على السؤال ومرر الدور بسرعة قبل انفجار القنبلة!</p>
                               <div class="box"><button onclick="alert('بدأ العد التنازلي! 10 ثوانٍ لذكر اسم 3 مأكولات تبدأ بحرف الجيم!')">إشعال فتيل القنبلة</button></div>`;
                    break;
            }
            document.getElementById('game-content').innerHTML = content;
        }

        function goHome() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
        }
    </script>
</body>
</html>
